name: Windows build and checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run build:native
      - run: npm run test:controllers
      - run: npm run test:host
      - run: npm run package:desktop
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: controller-companion-candidate-win-x64
          path: |
            artifacts/*.zip
            artifacts/latest-build.json
          retention-days: 14
