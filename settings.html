<!doctype html>
<html lang="en" data-host-role="settings">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Conroller Plus</title>
<link rel="stylesheet" href="src/wheel.css"><link rel="stylesheet" href="src/settings.css">
</head>
<body app-region="drag">
<div class="window-controls"><button data-window="minimize" aria-label="Minimize">−</button><button data-window="close" aria-label="Close">×</button></div>
<header class="navigation">
<span class="brand"></span>
<button data-tab="appearance" class="nav-tab active">Appearance <span class="chevron"></span></button>
<button data-tab="controller" class="nav-tab">Controller</button>
<button data-action="language" class="language-button" aria-label="Language"><span>A</span><b>文</b></button>
<button data-action="start" class="start-button">Get started</button>
</header>
<main>
<section id="appearance-page" class="page">
<div class="preview-column">
<div class="preview">
<div class="disc-tabs"><button data-disc="0">abc</button><button data-disc="1">ABC</button><button data-disc="2">123</button></div>
<div class="preview-wheels"><div id="preview-left" class="wheel"></div><div id="sectors" class="wheel"></div></div>
</div>
<div class="opacity-control"><span class="glass-icon">▱</span><input data-setting="opacity" type="range" min="0" max="100" aria-label="Opacity"><span class="glass-icon">▰</span></div>
</div>
<div class="appearance-options">
<button class="device-select" data-action="device"><i class="connection-dot"></i><span id="model-icon"></span><span id="device-name"></span><span class="chevron"></span></button>
<div class="appearance-rows">
<div class="option-row"><span class="option-name"><i data-icon="material"></i><span data-copy="material"></span></span><div class="segment material"><button data-opacity="0">Frosted</button><button data-opacity="50">Opaque</button><button data-opacity="100">Solid</button></div></div>
<div class="option-row"><span class="option-name"><i data-icon="dark-mode"></i><span data-copy="darkMode"></span></span><input class="theme-switch" data-system="theme" type="range" min="0" max="2" step="1" aria-label="Theme"></div>
<div class="option-row"><span class="option-name"><i data-icon="size"></i><span data-copy="size"></span></span><input data-setting="scale" type="range" min="50" max="150" aria-label="Size"></div>
<div class="option-row"><span class="option-name"><i data-icon="mode"></i><span data-copy="mode"></span></span><div class="segment"><button data-mode="single">Single</button><button data-mode="dual">Dual</button></div></div>
</div>
<div class="joystick-section">
<div class="option-name"><i data-icon="joystick"></i><span data-copy="joystick"></span></div>
<div class="joystick-grids">
<div class="joystick-grid" data-stick="left"><output class="axis-output">0, 0</output><div class="stick-circle"><i class="deadzone-circle"></i><b class="stick-point"></b></div><label><span data-copy="deadzoneLeft"></span><input type="number" data-setting="deadzoneLeft" min="0" max="40" step="1"><span>%</span></label><input type="range" data-setting="deadzoneLeft" min="0" max="40" aria-label="Left deadzone"></div>
<div class="joystick-grid" data-stick="right"><output class="axis-output">0, 0</output><div class="stick-circle"><i class="deadzone-circle"></i><b class="stick-point"></b></div><label><span data-copy="deadzoneRight"></span><input type="number" data-setting="deadzoneRight" min="0" max="40" step="1"><span>%</span></label><input type="range" data-setting="deadzoneRight" min="0" max="40" aria-label="Right deadzone"></div>
</div>
</div>
</div>
</section>
<section id="controller-page" class="page" hidden>
<div class="controller-left">
<div class="controller-row"><span data-copy="openClose"></span><i data-icon="stick-press"></i></div>
<div class="controller-row"><span data-copy="leftDisc"></span><button data-select-setting="leftDisc"></button></div>
<div class="controller-row"><span data-copy="rightDisc"></span><button data-select-setting="rightDisc"></button></div>
<div class="movement-description"><div><span data-copy="wheelClosed"></span><i data-icon="left-stick"></i><span data-copy="mouse"></span><i data-icon="right-stick"></i><span data-copy="scroll"></span></div><div><span data-copy="typing"></span><i data-icon="left-stick"></i><span data-copy="selection"></span><i data-icon="right-stick"></i><span id="right-stick-role"></span></div></div>
<div class="controller-row"><span data-copy="mouseSpeed"></span><input data-setting="mouseSpeed" type="range" min="150" max="8000"><input data-setting="mouseSpeed" type="number" min="150" max="8000" aria-label="Mouse speed"></div>
<div class="controller-row"><span data-copy="scrollSpeed"></span><input data-setting="scrollSpeed" type="range" min="1" max="20"><input data-setting="scrollSpeed" type="number" min="1" max="20" aria-label="Scroll speed"></div>
<div id="controller-diagram"></div>
</div>
<div class="controller-right">
<div class="binding-tabs"><button data-bind-mode="idle" data-copy="idle"></button><button data-bind-mode="typing" data-copy="singleInput"></button><button data-bind-mode="dual" data-copy="dualInput"></button><button data-action="restore" data-copy="restore"></button></div>
<div id="binding-list"></div>
<div class="system-options">
<div class="controller-row"><span data-copy="launch"></span><input data-system="startAtLogin" type="checkbox" role="switch" aria-label="Launch at login"></div>
<div class="controller-row"><span data-copy="closeBehavior"></span><button data-action="close-choice"></button></div>
<div class="maintenance-buttons"><button data-action="update"><span data-copy="update"></span><i id="update-dot" hidden></i></button><button data-action="repair" data-copy="repair"></button><span class="version">1.0.0</span></div>
</div>
</div>
</section>
</main>
<div id="popup" class="popup" hidden></div>
<output id="notice" hidden role="status"></output>
<script src="src/webview-bridge.js"></script><script type="module" src="src/runtime-entry.js"></script><script type="module" src="src/settings.js"></script>
</body></html>
