<!doctype html>
<html lang="zh-CN" data-host-role="settings">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Controller Companion · 设置</title>
  <link rel="stylesheet" href="src/wheel.css">
  <link rel="stylesheet" href="src/settings.css">
</head>
<body>
  <aside>
    <div class="brand" app-region="drag"><span class="app-icon"><img src="assets/app-icon.svg" alt=""></span><div>Controller<br><strong>Companion</strong></div></div>
    <div class="device"><span id="device-dot"></span><span id="device-status">等待手柄</span></div>
    <nav aria-label="设置分类" data-i18n-aria="nav.categories">
      <button type="button" class="selected" data-tab="appearance"><i class="figma-icon"><img src="assets/appearance-icon.svg" alt=""></i><span data-i18n="nav.appearance">外观</span></button>
      <button type="button" data-tab="controller"><i class="figma-icon"><img src="assets/controller-icon.png" alt=""></i><span data-i18n="nav.controller">手柄</span></button>
    </nav>
    <button type="button" id="more" class="system-nav" data-tab="system" aria-label="系统设置" data-i18n-aria="sidebar.hamburger" title="系统设置" data-i18n-title="sidebar.hamburger">☰ <span data-i18n="system.title">系统设置</span></button>
  </aside>

  <main>
    <header app-region="drag">
      <div><h1 id="page-title" data-i18n="page.appearance.title">外观</h1><p id="page-subtitle" data-i18n="page.appearance.subtitle">透明度、描边与大小。</p></div>
      <div class="window-actions"><button type="button" id="done" class="primary" data-i18n="top.minimize">最小化</button><button type="button" id="close-window" class="window-close" aria-label="关闭" data-i18n-aria="top.close">×</button></div>
    </header>

    <section id="preview" class="preview" aria-label="桌面上的转盘实时预览" data-i18n-aria="preview.desktop">
      <img id="desktop-image" alt="本地桌面截图">
      <div class="preview-top"><span class="preview-badge" data-i18n="preview.badge">外观预览</span><button type="button" id="refresh" aria-label="重新捕捉桌面" title="重新捕捉桌面" data-i18n-aria="preview.refresh" data-i18n-title="preview.refresh">↻</button></div>
      <div class="preview-wheel-space"><div id="preview-wheel"><div id="preview-left"></div><div id="sectors"></div></div></div>
      <div id="capture-message" role="status"></div>
      <div class="preview-bottom"><div class="segmented" aria-label="预览输入盘" data-i18n-aria="preview.input"><button type="button" data-mode="0" aria-pressed="true" data-i18n="preview.abc">abc</button><button type="button" data-mode="1" aria-pressed="false" data-i18n="preview.ABC">ABC</button><button type="button" data-mode="2" aria-pressed="false" data-i18n="preview.123">123</button></div></div>
    </section>

    <section data-panel="appearance">
      <div class="group">
        <div class="row"><label for="opacity" data-i18n="appearance.opacity">不透明度</label><div class="slider"><span>◌</span><input id="opacity" type="range" min="0" max="100" value="15"><span>●</span><output id="opacity-value">15%</output></div></div>
        <div class="row"><span data-i18n="appearance.material">材质</span><div class="segmented presets"><button type="button" data-opacity="15" data-i18n="appearance.translucent">通透</button><button type="button" data-opacity="50" data-i18n="appearance.soft">柔和</button><button type="button" data-opacity="100" data-i18n="appearance.solid">实色</button></div></div>
        <div class="row"><span data-i18n="appearance.character">字符</span><div class="segmented"><button type="button" data-ink="original" aria-label="深色字符"><b class="swatch dark"></b><span data-i18n="appearance.darkCharacter">深色</span></button><button type="button" data-ink="white" aria-label="浅色字符"><b class="swatch light"></b><span data-i18n="appearance.lightCharacter">浅色</span></button></div></div>
        <div class="row"><label for="scale" data-i18n="appearance.scale">大小</label><div class="slider"><span class="small-wheel">◔</span><input id="scale" type="range" min="55" max="110" value="85"><span>◔</span><output id="scale-value">85%</output></div></div>
      </div>
      <button type="button" id="custom-style" class="custom-entry" aria-expanded="false" aria-controls="style-editor"><span data-i18n="appearance.custom">自定义外观</span><span>›</span></button>
      <div id="style-editor" class="group" hidden>
        <div class="row"><label for="outline-color" data-i18n="appearance.outlineColor">选区描边</label><input id="outline-color" type="color" value="#1058f9"><label for="outline-width" data-i18n="appearance.outlineWidth">粗细</label><input id="outline-width" type="range" min="1" max="8" value="3"><output id="outline-width-value">3 px</output></div>
        <div class="row"><label for="fill-color" data-i18n="appearance.fillColor">扇区填充</label><input id="fill-color" type="color" value="#ffffff"><label for="text-color" data-i18n="appearance.textColor">字符颜色</label><input id="text-color" type="color" value="#444444"></div>
        <div class="row"><span data-i18n="appearance.reset">恢复默认</span><button type="button" id="reset-style" class="text-button" aria-label="恢复默认外观" data-i18n-aria="appearance.reset">↺</button></div>
      </div>
    </section>

    <section data-panel="controller" hidden>
      <div class="group">
        <div class="row"><label for="controller-select" data-i18n="controller.current">当前手柄</label><select id="controller-select" aria-label="当前手柄" data-i18n-aria="controller.current"></select></div>
        <div class="row"><span id="controller-support" class="muted">连接 USB 或蓝牙手柄</span><button type="button" id="calibrate" class="text-button" data-i18n="controller.calibrate">校准按键</button><button type="button" id="reset-controller" class="text-button" data-i18n="controller.reset">恢复自动识别</button></div>
      </div>
      <div class="group">
        <div class="row"><span data-i18n="controller.previewLayout">预览布局（默认）</span><div class="segmented"><button type="button" data-layout="single" data-i18n="controller.singlePreview">单盘预览</button><button type="button" data-layout="dual" data-i18n="controller.dualPreview">双盘预览</button></div></div>
        <div class="row"><span data-i18n="controller.activation">呼出 / 收起</span><span id="activation-label" class="keycap">L3</span></div>
        <input id="chord-interval" type="hidden" value="300" aria-hidden="true">
        <div class="row" id="disc-row"><label for="left-disc" data-i18n="controller.leftDisc">左盘</label><select id="left-disc"><option value="0">abc</option><option value="1">ABC</option><option value="2">123</option></select><label for="right-disc" data-i18n="controller.rightDisc">右盘</label><select id="right-disc"><option value="0">abc</option><option value="1">ABC</option><option value="2">123</option></select></div>
        <div class="row role-summary"><span data-i18n="controller.roleCollapsed">转盘收起</span><span id="collapsed-role"></span></div>
        <div class="row role-summary"><span data-i18n="controller.roleTyping">正在输入</span><span id="typing-role">Ⓛ 选区　Ⓡ 鼠标</span></div>
        <div class="row"><label for="mouse-speed" data-i18n="controller.mouseSpeed">鼠标速度</label><div class="slider"><input id="mouse-speed" type="range" min="150" max="6400" step="50" value="850"><output id="mouse-speed-value">850</output></div></div>
        <div class="row"><label for="scroll-speed" data-i18n="controller.scrollSpeed">滚动速度</label><div class="slider"><input id="scroll-speed" type="range" min="1" max="16" value="6"><output id="scroll-speed-value">6</output></div></div>
        <div class="row"><label for="deadzone" data-i18n="controller.deadzone">摇杆死区</label><div class="stick-meter"><span id="deadzone-ring"></span><i id="stick-dot"></i></div><div class="slider"><input id="deadzone" type="range" min="12" max="40" value="22"><output id="deadzone-value">22%</output></div></div>
        <div class="row controls-row" id="controls-summary"><div class="mapping-diamond"><button type="button" data-quick="Y" class="mapping-key top" aria-label="自定义 Y"><b>Y</b><small></small></button><button type="button" data-quick="X" class="mapping-key left" aria-label="自定义 X"><b>X</b><small></small></button><button type="button" data-quick="B" class="mapping-key right" aria-label="自定义 B"><b>B</b><small></small></button><button type="button" data-quick="A" class="mapping-key bottom" aria-label="自定义 A"><b>A</b><small></small></button></div><div class="mapping-diamond"><button type="button" data-quick="Up" class="mapping-key top" aria-label="自定义 Up"><b>↑</b><small></small></button><button type="button" data-quick="Left" class="mapping-key left" aria-label="自定义 Left"><b>←</b><small></small></button><button type="button" data-quick="Right" class="mapping-key right" aria-label="自定义 Right"><b>→</b><small></small></button><button type="button" data-quick="Down" class="mapping-key bottom" aria-label="自定义 Down"><b>↓</b><small></small></button></div></div>
        <div class="row"><span class="keycap">≡</span><span data-i18n="controller.switchWheel">切换输入盘</span><span class="keycap">LB / RB</span><span data-i18n="controller.opacityAdjust">透明度 − / ＋</span></div>
      </div>
      <button type="button" id="custom-buttons" class="custom-entry" aria-expanded="false" aria-controls="bindings-editor"><span data-i18n="controller.customButtons">自定义按键</span><span>›</span></button>
      <div id="bindings-editor" class="group" hidden>
        <div class="row"><div class="segmented"><button type="button" data-bind-mode="idle" aria-pressed="true" data-i18n="controller.bindingModeIdle">转盘收起</button><button type="button" data-bind-mode="typing" aria-pressed="false" data-i18n="controller.bindingModeTyping">单盘输入</button><button type="button" data-bind-mode="dual" aria-pressed="false" data-i18n="controller.bindingModeDual">双盘输入</button></div><button type="button" id="reset-bindings" class="text-button" data-i18n="controller.resetBindings">恢复默认</button></div>
        <div class="row"><span data-i18n="controller.bindingLayer">绑定层</span><div class="segmented"><button type="button" data-bind-layer="base" aria-pressed="true" data-i18n="controller.bindingBase">常规</button><button type="button" data-bind-layer="auxiliary" aria-pressed="false" data-i18n="controller.bindingAuxiliary">辅助</button></div></div>
        <div id="aux-hint" class="row muted" hidden data-i18n="controller.auxHint">先将任意按键设为「按住使用辅助绑定」</div><div id="binding-rows"></div><div class="row"><span>L3</span><span id="reserved-label" class="muted" data-i18n="controller.reservedSingle">呼出 / 收起 · 固定</span></div>
      </div>
    </section>

    <section data-panel="system" hidden>
      <div class="system-page-header"><div><h2 id="system-title" data-i18n="system.title">系统设置</h2><p id="system-subtitle" data-i18n="system.subtitle">应用行为、诊断与维护。</p></div><span id="system-version" class="muted"></span></div>
      <div class="group system-preferences">
        <div class="row"><label for="system-locale" data-i18n="system.language">界面语言</label><select id="system-locale"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="es">Español</option></select></div>
        <div class="row"><label for="system-theme" data-i18n="system.theme">主题</label><select id="system-theme"><option value="system" data-i18n="system.themeSystem">跟随系统</option><option value="light" data-i18n="system.themeLight">浅色</option><option value="dark" data-i18n="system.themeDark">深色</option></select></div>
        <div class="row"><label for="system-startup" data-i18n="system.startAtLogin">登录时启动</label><input id="system-startup" class="switch" type="checkbox" role="switch"></div>
        <div class="row"><label for="system-close" data-i18n="system.closeBehavior">点击关闭时</label><select id="system-close"><option value="tray" data-i18n="system.closeTray">最小化到托盘</option><option value="minimize" data-i18n="system.closeMinimize">最小化窗口</option><option value="quit" data-i18n="system.closeQuit">退出应用</option></select></div>
        <div class="row"><label for="enabled" data-i18n="system.enabled">后台输入</label><input id="enabled" class="switch" type="checkbox" role="switch" checked></div>
      </div>
      <div class="system-actions" aria-label="系统操作" data-i18n-aria="system.actions">
        <button type="button" id="system-diagnose" class="system-action" data-system-action="diagnose" data-i18n="system.diagnose">诊断</button>
        <button type="button" id="system-repair" class="system-action" data-system-action="repair" data-i18n="system.repair">修复</button>
        <button type="button" id="system-update" class="system-action" data-system-action="update" data-i18n="system.update">更新</button>
        <button type="button" id="system-firmware" class="system-action" data-system-action="firmware" data-i18n="system.firmware">固件支持</button>
        <button type="button" id="system-language" class="system-action" data-system-action="language-settings" data-i18n="system.languageSettings">Windows 语言设置</button>
      </div>
      <div id="system-status" role="status" aria-live="polite"></div><pre id="system-report" hidden></pre>
      <div class="system-footer"><button type="button" id="system-quit" class="danger system-action" data-system-action="quit" data-i18n="system.quit">退出 Controller Companion</button><span id="system-saved" class="muted" data-i18n="system.ready">设置已保存</span></div>
    </section>

    <footer><span id="hint"></span><span id="error" role="alert"></span></footer>
  </main>

  <dialog id="calibration-dialog"><h2 data-i18n="calibration.title">手柄按键校准</h2><p id="calibration-device"></p><progress id="calibration-progress" max="20" value="0"></progress><div id="calibration-glyph">Ⓛ Ⓡ</div><h3 id="calibration-prompt" data-i18n="calibration.release">松开所有按键，让摇杆回中</h3><p id="calibration-note" data-i18n="calibration.note">准备好后开始；每一步操作后松开并回中。</p><div class="calibration-actions"><button type="button" id="calibration-cancel" data-i18n="calibration.cancel">取消</button><button type="button" id="calibration-skip" hidden data-i18n="calibration.skip">跳过此项</button><button type="button" id="calibration-start" class="primary" data-i18n="calibration.start">开始校准</button><button type="button" id="calibration-save" class="primary" hidden data-i18n="calibration.save">保存校准</button></div></dialog>
  <script src="src/webview-bridge.js"></script>
  <script type="module" src="src/runtime-entry.js"></script>
  <script type="module" src="src/settings.js"></script>
</body>
</html>
